name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Run backend tests
        working-directory: ./backend-docker
        run: ./mvnw test

  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend-docker/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend-docker
        run: npm install --legacy-peer-deps

      - name: Build Angular app
        working-directory: ./frontend-docker
        run: npm run build

  build-and-push:
    needs: [test-backend, test-frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend-docker
          push: true
          tags: |
            ghcr.io/medyassinhamdi/docker-spring-angular-backend:latest
            ghcr.io/medyassinhamdi/docker-spring-angular-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend-docker
          push: true
          tags: |
            ghcr.io/medyassinhamdi/docker-spring-angular-frontend:latest
            ghcr.io/medyassinhamdi/docker-spring-angular-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max